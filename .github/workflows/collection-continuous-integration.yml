name: Collection build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ansible-version:
          - "2.19"
          - "2.21"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install specific Ansible version ${{ matrix.ansible-version }}
        run: |
          pip install "ansible-core~=${{ matrix.ansible-version }}.0"

      - name: Install dependencies
        run: ansible-galaxy collection install 'community.docker:==3.10.0' 'containers.podman:==1.15.0'

      - name: Install Ansible lint
        run: >-
          pip install ansible-lint "ansible-core~=${{ matrix.ansible-version }}.0"

      - name: Run ansible-lint
        run: >-
          ansible-lint --profile production

  build:
    name: Build timeseer collection
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ansible-version:
          - "2.21"
    needs: lint
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install specific Ansible version ${{ matrix.ansible-version }}
        run: |
          pip install "ansible-core~=${{ matrix.ansible-version }}.0"

      - name: Build Docker collection
        run: ansible-galaxy collection build ./timeseer/docker/ -v --output-path ./artifacts

      - name: Build podman collection
        run: ansible-galaxy collection build ./timeseer/podman/ -v  --output-path ./artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: collections
          path: artifacts/*.tar.gz
          retention-days: 7
